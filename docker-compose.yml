version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - memlite-data:/data
    environment:
      - MEMLITE_DATA_DIR=/data
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  memlite-data:
    driver: local
